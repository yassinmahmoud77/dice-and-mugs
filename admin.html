<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Dice & Mugs - Manager</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">Dice & Mugs</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#cafeNav" aria-controls="cafeNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="cafeNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Catalog</a></li>
                    <li class="nav-item"><a class="nav-link active" href="admin.html">Manager</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>


    <!-- MAIN -->

    <main>

        <section class="container py-5">

            <h1 class="section-title text-center mb-4">
                Manager Update Form
            </h1>

            <p>
                Add a new drink or board game
                to the cafe.
            </p>


            <form>


                <!-- ITEM TYPE -->

                <div class="mb-3">

                    <label for="itemType"
                           class="form-label">

                        Item Type

                    </label>

                    <select id="itemType"
                            class="form-select">

                        <option>
                            Drink
                        </option>

                        <option>
                            Board Game
                        </option>

                    </select>

                </div>


                <!-- ITEM NAME -->

                <div class="mb-3">

                    <label for="itemName"
                           class="form-label">

                        Item Name

                    </label>

                    <input type="text"
                           id="itemName"
                           class="form-control"
                           placeholder="Enter item name">

                </div>


                <!-- PRICE -->

                <div class="mb-3">

                    <label for="price"
                           class="form-label">

                        Price

                    </label>

                    <input type="number"
                           id="price"
                           class="form-control"
                           placeholder="Enter price">

                </div>


                <!-- DESCRIPTION -->

                <div class="mb-3">

                    <label for="description"
                           class="form-label">

                        Description

                    </label>

                    <textarea id="description"
                              class="form-control"
                              rows="4"
                              placeholder="Enter description"></textarea>

                </div>


                <!-- NUMBER OF PLAYERS -->

                <div class="mb-3">

                    <label for="players"
                           class="form-label">

                        Number of Players

                    </label>

                    <input type="text"
                           id="players"
                           class="form-control"
                           placeholder="Example: 2–4">

                </div>


                <!-- PUBLISHER -->

                <div class="mb-3">

                    <label for="publisher"
                           class="form-label">

                        Publisher

                    </label>

                    <input type="text"
                           id="publisher"
                           class="form-control"
                           placeholder="Enter publisher">

                </div>


                <!-- BUTTON -->

                <button type="submit"
                        class="btn btn-dark">

                    Add Item

                </button>


            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="text-center mt-5">

        <p>
            © 2026 Dice & Mugs
        </p>

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
